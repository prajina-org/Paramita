name: Verify web font

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 scripts/build_webfont.py --check
      - run: uv run --python 3.12 tests/verify_webfont.py
